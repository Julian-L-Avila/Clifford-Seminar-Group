name: Deploy Clifford Seminar Group Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage public site artifact
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml .nojekyll google235c06eb331003f1.html _site/
          cp -r assets bibliography schedule tex _site/
          find _site -type f \( \
            -name "*.aux" -o -name "*.bbl" -o -name "*.bcf" -o -name "*.blg" \
            -o -name "*.fdb_latexmk" -o -name "*.fls" -o -name "*.log" \
            -o -name "*.out" -o -name "*.run.xml" -o -name "*.synctex.gz" \
            -o -name "*.toc" \
          \) -delete

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
